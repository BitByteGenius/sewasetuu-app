name: sewasetu
description: "A large-scale multi-service marketplace Flutter application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management, Dependency Injection & Navigation
  get: ^4.6.6

  # Typography & Design System
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Networking & Caching
  dio: ^5.4.3+1
  cached_network_image: ^3.3.1

  # Local Persistence
  shared_preferences: ^2.2.3

  # Formatting & Utilities
  intl: ^0.19.0
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
